/**
 * 从指定构建输出目录取得唯一的目标文件。
 * @param sourceFolder Gradle 构建产物目录
 * @param extension 目标文件扩展名
 * @return 唯一匹配的构建产物
 */
def findSingleBuildArtifact(File sourceFolder, String extension) {
    File[] artifacts = (sourceFolder.listFiles() ?: [] as File[])
            .findAll { it.isFile() && it.name.endsWith(extension) } as File[]
    if (artifacts == null || artifacts.length == 0) {
        throw new FileNotFoundException("Can't find ${extension} artifact in ${sourceFolder.absolutePath}")
    }
    if (artifacts.length > 1) {
        throw new GradleException("Expected one ${extension} artifact in ${sourceFolder.absolutePath}, found ${artifacts.length}")
    }
    return artifacts[0]
}

/** Google Play 主包：归档 AAB 和对应 mapping，不生成 Walle 渠道包。 */
task makePlayRelease(dependsOn: 'bundlePlayRelease') {
    group = publishPlayGroupName
    description = "打 Google Play AAB 并归档"
    doLast {
        File aabFile = findSingleBuildArtifact(playReleaseSourceFolder, ".aab")
        if (!playReleaseMapping.exists()) {
            throw new FileNotFoundException("Can't find mapping: ${playReleaseMapping.absolutePath}")
        }
        if (!playReleaseFolder.exists() && !playReleaseFolder.mkdirs()) {
            throw new IOException("Can't create release folder: ${playReleaseFolder.absolutePath}")
        }
        playReleaseFolder.listFiles()?.findAll { it.isFile() && (it.name.endsWith(".aab") || it.name == "mapping.txt") }?.each {
            it.delete()
        }
        project.copy {
            from aabFile
            from playReleaseMapping
            into playReleaseFolder
            rename { fileName ->
                fileName.endsWith(".aab")
                        ? ProjectBuildConfig.Build.Android.buildAabName("release")
                        : fileName
            }
        }
        println("Google Play release archived: ${playReleaseFolder.absolutePath}")
    }
}


/**
 * 加固后的apk 对齐压缩
 * @param apk 已加固apk
 * @return 返回对齐压缩后的apk
 */
def zipAlignApk(File apk) {
    if (apk == null || !apk.exists()) {
        println "---zipalign reinforceApk throw exception and forced stop!---"
        throw new FileNotFoundException('apk is not exists and cannot reinforce')
    }
    def file = new File("${apk.absolutePath.replace(".apk", "_zip.apk")}")
    if (file.exists()) {
        file.delete()
    }
    runCommand {
        def zipAlign = new File(getApkSignerAndZipAlignPath(), isWindowsHost() ? "zipalign.exe" : "zipalign")
        commandLine zipAlign.absolutePath, "-v", "-p", "4", apk.absolutePath, file.absolutePath
    }
    if (apk.exists()) {
        apk.delete()
    }
    return file
}
/**
 * 对apk签名
 * @param zipApk 压缩对齐后的apk
 * @return 签名后的apk
 */
def signApkV2(File apkFile) {
    if (apkFile == null || !apkFile.exists()) {
        println "---sign apkFile throw exception and forced stop!---"
        throw new FileNotFoundException('apk is not exists and cannot reinforce')
    }
    def file = new File("${apkFile.absolutePath.replace("_zip.apk", "_sign.apk")}")
    if (file.exists()) {
        file.delete()
    }
    def releaseConfig = project.extensions.findByName("android").signingConfigs.findByName("release")
    def storeFile = releaseConfig.storeFile
    def keyAlias = releaseConfig.keyAlias
    def keyPassword = releaseConfig.keyPassword
    def storePassword = releaseConfig.storePassword

    runCommand {
        def apkSigner = new File(getApkSignerAndZipAlignPath(), isWindowsHost() ? "apksigner.bat" : "apksigner")
        commandLine apkSigner.absolutePath, "sign",
                "--ks", storeFile.absolutePath,
                "--ks-key-alias", keyAlias,
                "--ks-pass", "pass:${storePassword}",
                "--key-pass", "pass:${keyPassword}",
                "--out", file.absolutePath,
                apkFile.absolutePath
    }
    if (apkFile.exists()) {
        apkFile.delete()
    }
    def signBeforeFile = new File("${file.absolutePath}.idsig")
    if (signBeforeFile.exists()) {
        signBeforeFile.delete()
    }
    return file
}

/** VMP 改写 AAB 后会移除原 ZIP/JAR 签名；使用 upload key 对输出 AAB 原地重新签名。 */
def signAabWithUploadKey(File aabFile) {
    if (aabFile == null || !aabFile.exists()) {
        throw new FileNotFoundException("AAB is not exists and cannot sign")
    }
    def releaseConfig = project.extensions.findByName("android").signingConfigs.findByName("release")
    def jarsigner = new File(System.getProperty("java.home"), "bin" + File.separator + (isWindowsHost() ? "jarsigner.exe" : "jarsigner"))
    runCommand {
        commandLine jarsigner.absolutePath,
                "-keystore", releaseConfig.storeFile.absolutePath,
                "-storepass", releaseConfig.storePassword,
                "-keypass", releaseConfig.keyPassword,
                aabFile.absolutePath,
                releaseConfig.keyAlias
    }
    runCommand {
        commandLine jarsigner.absolutePath, "-verify", aabFile.absolutePath
    }
    return aabFile
}
/***
 * 获取 SDK 目录下的最新 SDK 版本路径
 * @return
 */
def getApkSignerAndZipAlignPath() {
    def sdkDirectory = new File(parseLocalProperties(), "build-tools")
    def buildToolVersions = sdkDirectory.listFiles()?.findAll { it.isDirectory() }?.sort { it.name }
    if (!buildToolVersions) {
        throw new FileNotFoundException("Cannot find Android build-tools under ${sdkDirectory.absolutePath}")
    }
    return buildToolVersions.last()
}

def isWindowsHost() {
    return System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("win")
}
/***
 * 获取 SDK 路径
 * @return
 */
def parseLocalProperties() {
    File file = rootProject.file("local.properties")
    if (file.exists()) {
        InputStream inputStream = file.newDataInputStream()
        Properties properties = new Properties()
        properties.load(inputStream)
        return properties.getProperty("sdk.dir") //
    }
    throw new FileNotFoundException('local.properties is not exists and cannot reinforce')
}
