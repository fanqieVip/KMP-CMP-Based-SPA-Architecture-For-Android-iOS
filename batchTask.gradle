/**主包*/
task makeChinaRelease(dependsOn: 'assembleChinaRelease') {
    group = publishChinaGroupName
    description = "打主包"
    doLast {
        File apkFile = null
        File apkFolder = chinaReleaseSourceFolder
        // 获取该文件夹下的所有文件
        File[] apkFiles = apkFolder.listFiles()
        int i = 0
        for (File file : apkFiles) {
            if (file.isFile() && file.getName().endsWith(".apk")) {
                // 获取后缀名为.apk的文件
                apkFile = file
                i++
            }
        }
        if (i > 1) {
            println("There are multiple folders under this folder apk：" + apkFile.absolutePath)
            return
        }
        if (apkFile == null || !apkFile.exists()) {
            println("Can't find the apk：" + apkFile.absolutePath)
            return
        }

        println("apk location $apkFile.absolutePath")
        def deskApkFileFolder = chinaReleaseFolder
        if (!deskApkFileFolder.exists() || deskApkFileFolder.isFile()) {
            deskApkFileFolder.mkdirs()
        }
        for (File apk : deskApkFileFolder.listFiles()) {
            if (apk.isFile() && apk.name.startsWith(ProjectBuildConfig.Build.Android.buildApkNamePrefix("release")) && apk.name.endsWith(".apk")) {
                apk.delete()
            }
        }
        runCommand {
            executable = 'java'
            args = ['-jar', "../tools/walle-cli-all.jar",
                    'put', '-c',
                    ChannelConfig.default_channel,//主包渠道名称
                    apkFile.absolutePath,
                    "${deskApkFileFolder.absolutePath}/${apkFile.name}"
            ]
        }
        def exitMapping = file("${deskApkFileFolder.absolutePath}/mapping.txt")
        if (exitMapping.exists() && exitMapping.isFile()) {
            exitMapping.delete()
        }
        //复制mapping.txt
        project.copy {
            from chinaReleaseMapping
            into deskApkFileFolder
        }
    }
}
