/**
 * 拷贝测试apk并发布到钉钉
 * @param distribution 发行目标
 * @param environment
 * @return
 */
def copyTestApkDing(String distribution, String environment, String testApkFolder, File testApkVersionDesc, boolean isDev) {
    File apkFile = null
    File apkFolder = file("${projectDir.absolutePath}/build/outputs/apk/${distribution}/${environment}/")
    // 获取该文件夹下的所有文件
    File[] apkFiles = apkFolder.listFiles()
    int i = 0
    for (File file : apkFiles) {
        if (file.isFile() && file.getName().endsWith(".apk")) {
            // 获取后缀名为.apk的文件
            apkFile = file
            i++
        }
    }
    if (i > 1) {
        println("There are multiple folders under this folder apk：" + apkFile.absolutePath)
        return
    }
    if (apkFile == null || !apkFile.exists()) {
        println("Can't find the apk：" + apkFile.absolutePath)
        return
    }
    println("apk location $apkFile.absolutePath")
    def deskApkFileFolder = file("${testApkFolder}/${environment}/")
    if (!deskApkFileFolder.exists() || deskApkFileFolder.isFile()) {
        deskApkFileFolder.mkdirs()
    }
    //删除相同版本已经存在的apk
    def apkNamePrefix = ProjectBuildConfig.Build.Android.buildApkNamePrefix(environment)
    for (File file : deskApkFileFolder.listFiles()) {
        if (file.isFile() && file.name.startsWith(apkNamePrefix) && file.name.endsWith(".apk")) {
            file.delete()
        }
    }
    //执行拷贝
    def deskApk = file("${deskApkFileFolder.absolutePath}/${apkFile.name}")
    project.copy {
        from apkFile
        into deskApkFileFolder
    }
    def testApkAddress = "${getTestApkServerAddress()}/${ProjectBuildConfig.Build.appName}/${distribution}/${if (isDev) { "dev" } else { "test" }}"
    def apkUrl = "${testApkAddress}/${environment}/${apkFile.name}"
    createDefaultVersionDesc(testApkVersionDesc)
    DingHelper.dingInnerApk(deskApk, apkUrl, testApkAddress, environment, testApkVersionDesc, isDev)
    System.out.println("")
    System.out.println("【${environment}】TestApk Address: ${apkUrl}")
}

/**
 * 创建渠道配置文件
 */
def createChannelsFile(File channelsFile) {
    if (channelsFile.exists() && channelsFile.isFile()) {
        channelsFile.delete()
    }
    def channelsFileDir = channelsFile.parentFile
    if (!channelsFileDir.exists()) {
        channelsFileDir.mkdirs()
    }
    channelsFile.createNewFile()
    def channelsWriter = new BufferedWriter(new FileWriter(channelsFile, Charset.forName("utf-8")))
    ChannelConfig.channels.forEach {
        channelsWriter.writeLine(it)
    }
    channelsWriter.flush()
    channelsWriter.close()
}
/**
 * 创建默认的版本说明文件(仅不存在时创建)
 * @param testApkVersionDesc
 */
def createDefaultVersionDesc(File versionDesc) {
    if (!versionDesc.exists() || !versionDesc.isFile()) {
        System.out.println("[Warning] Detected version_desc file is not exist, now create default file at ${versionDesc.absolutePath}")
        def versionDescDir = versionDesc.parentFile
        if (!versionDescDir.exists()) {
            versionDescDir.mkdirs()
        }
        versionDesc.createNewFile()
        def versionDescWriter = new BufferedWriter(new FileWriter(versionDesc, Charset.forName("utf-8")))
        versionDescWriter.writeLine("无更新说明")
        versionDescWriter.flush()
        versionDescWriter.close()
    }
}


/**
 * 计算 APK 内单个 ZipEntry 的 SHA-256；必须与 EnvCheckerUtils.sha256HexForZipEntry() 保持一致。
 */
def sha256HexForZipEntry(java.util.zip.ZipFile zipFile, java.util.zip.ZipEntry entry) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    zipFile.getInputStream(entry).withCloseable { input ->
        byte[] buffer = new byte[8192]
        int length
        while ((length = input.read(buffer)) > 0) {
            digest.update(buffer, 0, length)
        }
    }
    return digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

/**
 * 构建加密写入 world_city_data_3214.dat 的标准明文清单。
 * Walle 渠道信息写在 APK Signing Block 中，且在签名后写入，所以这里故意不参与清单计算。
 */
def buildApkIntegrityPlainText(File apkFile) {
    def names = []
    def zipFile = new java.util.zip.ZipFile(apkFile)
    try {
        zipFile.entries().each { entry ->
            def name = entry.name
            if (entry.isDirectory()) {
                return
            }
            if (name == apkIntegrityAssetEntryName) {
                return
            }
            if (name == "AndroidManifest.xml" ||
                    name == "resources.arsc" ||
                    (name ==~ /classes\d*\.dex/) ||
                    (name.startsWith("lib/") && name.endsWith(".so"))) {
                names.add(name)
            }
        }
        names.sort()
        def builder = new StringBuilder()
        builder.append("world-city-data-v1\n")
        names.each { name ->
            def entry = zipFile.getEntry(name)
            builder.append(name)
                    .append('|').append(entry.size)
                    .append('|').append(entry.crc)
                    .append('|').append(entry.method)
                    .append('|').append(sha256HexForZipEntry(zipFile, entry))
                    .append('\n')
        }
        return builder.toString()
    } finally {
        zipFile.close()
    }
}

/**
 * 在 VMP 输出后、渠道签名/拷贝前，新增或替换加密完整性校验 asset。
 * 运行期校验逻辑在 EnvCheckerUtils.verifyApkIntegritySignature() 中。
 */
def writeApkIntegritySignature(File apkFile) {
    def plainText = buildApkIntegrityPlainText(apkFile)
    def cipherBytes = Aes256cbc.INSTANCE.encryptBytes(plainText.getBytes("UTF-8"), apkIntegrityPassword.toString(), apkIntegrityIv.toString())
    def tempFile = new File(apkFile.parentFile, apkFile.name + ".world_city_tmp")
    if (tempFile.exists()) {
        tempFile.delete()
    }
    def skipped = false
    new java.util.zip.ZipInputStream(new java.io.BufferedInputStream(new java.io.FileInputStream(apkFile))).withCloseable { zin ->
        new java.util.zip.ZipOutputStream(new java.io.BufferedOutputStream(new java.io.FileOutputStream(tempFile))).withCloseable { zout ->
            java.util.zip.ZipEntry entry
            byte[] buffer = new byte[8192]
            while ((entry = zin.nextEntry) != null) {
                if (entry.name == apkIntegrityAssetEntryName) {
                    skipped = true
                    zin.closeEntry()
                    continue
                }
                def outEntry = new java.util.zip.ZipEntry(entry.name)
                outEntry.time = entry.time
                outEntry.comment = entry.comment
                outEntry.extra = entry.extra
                outEntry.method = entry.method
                if (entry.method == java.util.zip.ZipEntry.STORED) {
                    outEntry.size = entry.size
                    outEntry.compressedSize = entry.compressedSize
                    outEntry.crc = entry.crc
                }
                zout.putNextEntry(outEntry)
                int length
                while ((length = zin.read(buffer)) > 0) {
                    zout.write(buffer, 0, length)
                }
                zout.closeEntry()
                zin.closeEntry()
            }
            def integrityEntry = new java.util.zip.ZipEntry(apkIntegrityAssetEntryName)
            integrityEntry.time = System.currentTimeMillis()
            zout.putNextEntry(integrityEntry)
            zout.write(cipherBytes)
            zout.closeEntry()
        }
    }
    if (!apkFile.delete()) {
        throw new IOException("Cannot replace apk for world city integrity: " + apkFile.absolutePath)
    }
    if (!tempFile.renameTo(apkFile)) {
        throw new IOException("Cannot move world city integrity apk: " + tempFile.absolutePath)
    }
    println("apk integrity signature written: " + apkIntegrityAssetEntryName + (skipped ? " (replaced)" : ""))
}
/**将主包中的dex转成so*/
task protectChinaApk() {
    group = publishChinaGroupName
    description = "将主包中的dex转成so"
    doLast {
        /******************** vmp加密 *********************/
        //vmp工具目录
        def vmpFolder = file("${testApkRootFolder.absolutePath}/vmp/")
        if (vmpFolder.exists() && vmpFolder.isDirectory()) {
            vmpFolder.deleteDir()
        }
        vmpFolder.mkdirs()
        //获取ANDROID_SDK_HOME
        def sdkDirectory = file("${parseLocalProperties()}")
        //获取ANDROID_NDK_HOME
        def ndkDirectory = file("${parseLocalProperties()}/ndk/${ProjectBuildConfig.Build.Android.ndkVersion}")
        //获取CMAKE_PATH
        def cmakeDirectory = file("${parseLocalProperties()}/cmake/").listFiles().find { it.isDirectory() }
        // 使用当前 Gradle JVM；Windows 与 macOS/Linux 的可执行文件名不同。
        def isWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("win")
        def javaExePath = new File(System.getProperty("java.home"), "bin" + File.separator + (isWindows ? "java.exe" : "java"))
        //拷贝vmpJar
        def sourceVmpJar = file("${toolsFolder.absolutePath}/${vmpJarName}")
        project.copy {
            from sourceVmpJar
            into vmpFolder
        }
        def exeVmpJar = file("${vmpFolder.absolutePath}/${vmpJarName}")
        //生成rules.txt
        def vmpRules = file("${testApkRootFolder.absolutePath}/vmp/rules.txt")
        def vmpRulesWriter = new BufferedWriter(new FileWriter(vmpRules, Charset.forName("utf-8")))
        VmpConfig.protectRules.forEach {
            vmpRulesWriter.writeLine(it)
        }
        vmpRulesWriter.flush()
        vmpRulesWriter.close()
        //获取要进行vmp加密的apk
        File apkFile = null
        File apkFolder = chinaReleaseFolder
        File[] apkFiles = apkFolder.listFiles()
        File pendingVmpApk = apkFiles.find { it.isFile() && it.name.endsWith("_vmp.apk") }
        if (pendingVmpApk != null) {
            println("Resuming post-VMP alignment and signing: ${pendingVmpApk.absolutePath}")
            signApkV2(zipAlignApk(pendingVmpApk))
            return
        }
        for (File file : apkFiles) {
            if (file.isFile() && file.getName().endsWith(".apk")) {
                // 获取后缀名为.apk的文件
                apkFile = file
            }
        }
        //获取mapping
        def mappingFile = file("${chinaReleaseFolder.absolutePath}/mapping.txt")
        //vmp编译结果目录
        def vmpBuildDir = file("${apkFile.parentFile.absolutePath}/build/")
        if (vmpBuildDir.exists() && vmpBuildDir.isDirectory()) {
            vmpBuildDir.deleteDir()
        }
        //执行apk加密
        runCommand {
            environment "ANDROID_SDK_HOME", sdkDirectory.absolutePath
            environment "ANDROID_NDK_HOME", ndkDirectory.absolutePath
            environment "CMAKE_PATH", cmakeDirectory.absolutePath + File.separator
            environment "USE_LEGACY_PACKAGING", ProjectBuildConfig.Build.Android.useJniLegacyPackaging.toString()
            commandLine javaExePath.absolutePath, "-jar", exeVmpJar.absolutePath,
                    "apk", apkFile.absolutePath, vmpRules.absolutePath, mappingFile.absolutePath,
                    "--lib-name", VmpConfig.nmmpName,
                    "--class-name", VmpConfig.className.replace('/', '.')
        }
        //将加密后的apk移动到源apk目录
        def vmpBuildFile = vmpBuildDir.listFiles().find { it.name.endsWith("-protect.apk") }
        def vmpResultFile = file("${vmpBuildDir.absolutePath}/${vmpBuildFile.name.substring(0, vmpBuildFile.name.lastIndexOf("-protect.apk"))}_vmp.apk")
        vmpBuildFile.renameTo(vmpResultFile)
        //写入apk完整性签名文件
        writeApkIntegritySignature(vmpResultFile)
        project.copy {
            from vmpResultFile
            into apkFile.parentFile
        }
        //删除临时文件
        apkFile.delete()
        vmpBuildDir.deleteDir()
        vmpFolder.deleteDir()

        /******************** 对齐及签名 *********************/
        signApkV2(zipAlignApk(chinaReleaseFolder.listFiles().find {it.isFile() && it.getName().endsWith(".apk")}))
    }
}

/**
 * Google Play AAB 加固入口。
 * AAB 不做 APK 的 zipalign、apksigner 和 APK 完整性 asset 写入；VMP 改写后以 upload key 重签名。
 */
task protectPlayAab() {
    group = publishPlayGroupName
    description = "对 Google Play Release AAB 执行 VMP 加固并以 upload key 重签名"
    doLast {
        def vmpFolder = file("${testApkRootFolder.absolutePath}/vmp/play/")
        if (vmpFolder.exists() && vmpFolder.isDirectory()) {
            vmpFolder.deleteDir()
        }
        vmpFolder.mkdirs()
        def sdkDirectory = file("${parseLocalProperties()}")
        def ndkDirectory = file("${parseLocalProperties()}/ndk/${ProjectBuildConfig.Build.Android.ndkVersion}")
        def cmakeDirectory = file("${parseLocalProperties()}/cmake/").listFiles().find { it.isDirectory() }
        def javaExePath = new File(System.getProperty("java.home"), "bin" + File.separator + (isWindowsHost() ? "java.exe" : "java"))
        def sourceVmpJar = file("${toolsFolder.absolutePath}/${vmpJarName}")
        project.copy {
            from sourceVmpJar
            into vmpFolder
        }
        def exeVmpJar = file("${vmpFolder.absolutePath}/${vmpJarName}")
        def vmpRules = file("${vmpFolder.absolutePath}/rules.txt")
        def vmpRulesWriter = new BufferedWriter(new FileWriter(vmpRules, Charset.forName("utf-8")))
        VmpConfig.protectRules.forEach {
            vmpRulesWriter.writeLine(it)
        }
        vmpRulesWriter.flush()
        vmpRulesWriter.close()
        File aabFile = findSingleBuildArtifact(playReleaseFolder, ".aab")
        def mappingFile = file("${playReleaseFolder.absolutePath}/mapping.txt")
        if (!mappingFile.exists()) {
            throw new FileNotFoundException("Can't find mapping: ${mappingFile.absolutePath}")
        }
        // AabFolders 输出到 bundleOut；APK 流程才使用 build。
        def vmpBuildDir = file("${aabFile.parentFile.absolutePath}/bundleOut/")
        if (vmpBuildDir.exists() && vmpBuildDir.isDirectory()) {
            vmpBuildDir.deleteDir()
        }
        runCommand {
            environment "ANDROID_SDK_HOME", sdkDirectory.absolutePath
            environment "ANDROID_NDK_HOME", ndkDirectory.absolutePath
            environment "CMAKE_PATH", cmakeDirectory.absolutePath + File.separator
            environment "USE_LEGACY_PACKAGING", ProjectBuildConfig.Build.Android.useJniLegacyPackaging.toString()
            commandLine javaExePath.absolutePath, "-jar", exeVmpJar.absolutePath,
                    "aab", aabFile.absolutePath, vmpRules.absolutePath,
                    "--lib-name", VmpConfig.nmmpName,
                    "--class-name", VmpConfig.className.replace('/', '.')
        }
        def vmpBuildFile = vmpBuildDir.listFiles().find { it.name.endsWith("-protect.aab") }
        if (vmpBuildFile == null) {
            throw new FileNotFoundException("VMP did not produce a protected AAB in ${vmpBuildDir.absolutePath}")
        }
        def vmpResultFile = file("${vmpBuildDir.absolutePath}/${vmpBuildFile.name.substring(0, vmpBuildFile.name.lastIndexOf("-protect.aab"))}_vmp.aab")
        vmpBuildFile.renameTo(vmpResultFile)
        signAabWithUploadKey(vmpResultFile)
        project.copy {
            from vmpResultFile
            into playReleaseFolder
        }
        aabFile.delete()
        vmpBuildDir.deleteDir()
        vmpFolder.deleteDir()
    }
}
/**
 * 递归遍历子模块及其依赖的子模块拷贝libs
 * @param project
 * @param processedProjects
 * @param targetDir
 */
def traverseSubprojectsCopy(Project project, HashSet processedProjects, File targetDir) {
    if (processedProjects.contains(project)) {
        return // 如果已经处理过，则跳过
    }
    processedProjects.add(project)
    //app模块不处理
    if (name != project.name) {
        // 查找子模块的 libs 目录
        def libsDir = file("${project.projectDir}/libs/android")
        if (libsDir.exists()) {
            // 查找 libs 目录下的 .aar 和 .jar 文件
            copyFilesRecursively(libsDir, targetDir, project.name)
        }
    }
    // 递归处理implementation依赖的子模块
    project.configurations.getByName("androidMainImplementation").allDependencies.each { dependency ->
        if (dependency instanceof org.gradle.api.artifacts.ProjectDependency) {
            def projectPath = dependency.getPath()
            def subProject = project.rootProject.project(projectPath)
            traverseSubprojectsCopy(subProject, processedProjects, targetDir)
        }
    }
    // 递归处理api依赖的子模块
    project.configurations.getByName("androidMainApi").allDependencies.each { dependency ->
        if (dependency instanceof org.gradle.api.artifacts.ProjectDependency) {
            def projectPath = dependency.getPath()
            def subProject = project.rootProject.project(projectPath)
            traverseSubprojectsCopy(subProject, processedProjects, targetDir)
        }
    }
}
/**
 * 递归复制libs文件夹中的jar、aar
 */
def copyFilesRecursively(File sourceDir, File targetDir, String moduleName) {
    sourceDir.eachFile { file ->
        if (file.isDirectory()) {
            // 如果是子文件夹，递归处理
            def newTargetDir = new File(targetDir, file.name)
            if (!newTargetDir.exists()) {
                newTargetDir.mkdirs() // 在目标目录中创建对应的子文件夹
            }
            copyFilesRecursively(file, newTargetDir, moduleName)
        } else {
            // 如果是文件，检查是否为 .aar 或 .jar 文件
            def lowerCaseName = file.name.toLowerCase()
            if (lowerCaseName.endsWith('.aar') || lowerCaseName.endsWith('.jar')) {
                // 复制文件到目标目录
                def targetFile = new File(targetDir, file.name)
                if (!targetFile.exists()) {
                    println "Copying ${file.name} from ${moduleName} to ${targetDir}"
                    file.withInputStream { input ->
                        targetFile.withOutputStream { output ->
                            output << input
                        }
                    }
                } else {
                    println "Skipping ${file.name} (already exists in ${targetDir})"
                }
            }
        }
    }
}

// 构建前自动合并app模块引用的子模块（含嵌套模块）中的aar、jar到sharedLibs
preBuild.dependsOn(task("copySharedLibs") {
    doLast {
        // 目标目录：app 模块下的 moduleLibs 目录
        def targetDir = file("${project.projectDir}/shared_libs/android")
        targetDir.deleteDir()
        if (!targetDir.exists() || !targetDir.isDirectory()) {
            targetDir.mkdirs()
        }
        // 用于记录已经处理过的子模块，避免重复处理
        def processedProjects = new HashSet()
        // 从app模块开始遍历
        traverseSubprojectsCopy(project, processedProjects, targetDir)
    }
})

