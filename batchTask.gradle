/**
 * 启动当前项目本地Apk服务器（将自动添加开机自启任务）
 */
task startLocalServer() {
    group = submitServerGroupName
    description = "启动当前项目本地Apk服务器（将自动添加开机自启任务）"
    doLast {
        def miniServe = file("${testApkRootFolder.absolutePath}/${niniserveFileName}")
        def batFolder = file("${testApkRootFolder.absolutePath}/bat/")
        if (batFolder.exists() && batFolder.isDirectory()) {
            batFolder.deleteDir()
        }
        batFolder.mkdirs()
        // 生成miniServe.bat，用于启动本地FTP服务
        def miniServeBat = file("${batFolder.absolutePath}/miniServe.bat")
        if (miniServeBat.exists() && miniServeBat.isFile()) {
            miniServeBat.delete()
        }
        miniServeBat.createNewFile()
        def miniServeBatWriter = new FileWriter(miniServeBat)
        miniServeBatWriter.write("@echo off")
        miniServeBatWriter.write("\n")
        miniServeBatWriter.write("start /b \"TestApkServer\" ${miniServe.absolutePath} ${allApkFolder} -p ${ProjectBuildConfig.Other.serverPort}")
        miniServeBatWriter.flush()
        miniServeBatWriter.close()
        // 用于执行miniServe.bat，避免miniServe.bat执行后会有cmd窗口常驻任务栏的问题
        def nircmd = file("${testApkRootFolder.absolutePath}/nircmd.exe")
        def cmd = "start ${nircmd.absolutePath} exec hide \"${miniServeBat.absolutePath}\""
        // 如果之前已经启动了Apk服务器，则先关闭
        def pid = isProcessRunning(niniserveFileName, ProjectBuildConfig.Other.serverPort)
        if (pid != null) {
            killProcessByPid(pid)
        }
        //删除已存在的自启任务
        def startUpTask = "${ProjectBuildConfig.Build.applicationId}_hideMiniServe"
        runCommand {
            commandLine "cmd", "/c", "schtasks /delete /tn \"${startUpTask}\" /f"
            ignoreExitValue true //当任务不存在时，调用删除会抛异常，该情况可以直接忽略
        }
        //拷贝本地服务器工具
        if (!nircmd.exists() || !nircmd.isFile()) {
            project.copy {
                from file("${toolsFolder.absolutePath}/nircmd.exe")
                into testApkRootFolder
            }
        }
        def nircmdc = file("${testApkRootFolder.absolutePath}/nircmdc.exe")
        if (!nircmdc.exists() || !nircmdc.isFile()) {
            project.copy {
                from file("${toolsFolder.absolutePath}/nircmdc.exe")
                into testApkRootFolder
            }
        }
        if (!miniServe.exists() || !miniServe.isFile()) {
            project.copy {
                from file("${toolsFolder.absolutePath}/${niniserveFileName}")
                into testApkRootFolder
            }
        }
        // 检测指定的allApkFolder目录是否存在，如果不存在则必须创建一个，否则会导致启动失败
        def allApkFolderDir = file("${allApkFolder}/")
        if (!allApkFolderDir.exists() || !allApkFolderDir.isDirectory()) {
            System.out.println("[Waring]TestApkServer detected apk folder is not exits, will automatically created it")
            allApkFolderDir.mkdirs()
        }
        // 启动本地Apk服务器
        runCommand {
            commandLine "cmd", "/c", cmd
        }
        System.out.println("TestApkServer Address: ${getTestApkServerAddress()}")
        //添加开机自启任务 taskschd.msc快速进入用户界面检查
        runCommand {
            commandLine "cmd", "/c", "schtasks /create /tn \"${startUpTask}\" /tr \"${nircmd.absolutePath} exec hide \'${miniServeBat.absolutePath}\'\" /sc onstart /ru SYSTEM"
        }
        System.out.println("add TestApkServer to windows startup success!")
    }
}
