<!DOCTYPE html>
<html>
<head>
    <title>WebView通信演示</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <h2>WebView通信演示</h2>
    
    <div>
        <button onclick="callGetUserInfo()">获取用户信息</button>
        <button onclick="callGetDeviceInfo()">获取设备信息</button>
    </div>
    
    <script>
        // 引入 WebViewBridge 类
        class WebViewBridge {
            constructor() {
                this.callbacks = new Map();
                this.callbackCounter = 0;
                this.setupPlatform();
            }
            
            setupPlatform() {
                const ua = navigator.userAgent.toLowerCase();
                this.isAndroid = /android/.test(ua);
                this.isIOS = /iphone|ipad|ipod/.test(ua);
            }
            
            generateId() {
                return `cb_${Date.now()}_${++this.callbackCounter}`;
            }
            
            callNative(action, data) {
                return new Promise((resolve, reject) => {
                    const callbackId = this.generateId();
                    this.callbacks.set(callbackId, { resolve, reject });
                    
                    try {
                        const payload = {
                            methodName: action,
                            callbackId: callbackId,
                            jsonParams: data === undefined ? null : JSON.stringify(data)
                        };
                        this.invokeNative(payload);
                    } catch (error) {
                        this.callbacks.delete(callbackId);
                        reject(error);
                    }
                });
            }
            
            invokeNative(payload) {
                const message = JSON.stringify(payload);
                if (this.isIOS && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kmp) {
                    window.webkit.messageHandlers.kmp.postMessage(message);
                } else if (this.isAndroid && window.kmp) {
                    window.kmp.callNative(message);
                } else {
                    alert('错误：未找到 WebView 桥接，请确保在 WebView 环境中运行');
                    throw new Error('未找到 WebView 桥接，请确保在 WebView 环境中运行');
                }
            }
            
            onKmpCallback(callbackId, dataJson) {
                const callback = this.callbacks.get(callbackId);
                if (!callback) {
                    console.warn(`未找到回调 ID: ${callbackId}`);
                    return;
                }
                
                this.callbacks.delete(callbackId);
                
                try {
                    let data = null;
                    if (dataJson && dataJson !== 'null' && dataJson !== 'undefined') {
                        data = JSON.parse(dataJson);
                    }
                    callback.resolve(data)
                } catch (error) {
                    callback.reject(new Error('解析响应数据失败'));
                }
            }
        }
        
        // 创建全局桥接实例
        const bridge = new WebViewBridge();
        
        // 原生回调方法（供原生调用）
        window.onKmpCallback = function(callbackId, dataJson) {
            bridge.onKmpCallback(callbackId, dataJson);
        };
        
        // 测试函数 - 调用原生获取用户信息
        async function callGetUserInfo() {
            try {
                const result = await bridge.callNative('getUserInfo', { 'id':'abas', 'name':'3dsdf', 'age':'123234233' });
                alert('获取用户信息成功:\n' + JSON.stringify(result, null, 2));
            } catch (error) {
                alert('获取用户信息失败:\n' + error.message || JSON.stringify(error));
            }
        }
        
        // 测试函数 - 调用原生获取设备信息
        async function callGetDeviceInfo() {
            try {
                const result = await bridge.callNative('getDeviceInfo', 12);
                alert('获取设备信息成功:\n' + JSON.stringify(result, null, 2));
            } catch (error) {
                alert('获取设备信息失败:\n' + error.message || JSON.stringify(error));
            }
        }

        // 原生主动调用JS的方法
        window.getUserInfoByH5 = function(dataJson) {
            try {
                const data = JSON.parse(dataJson);
                alert('收到原生主动调用，数据:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                alert('解析原生调用数据失败:\n' + error.message);
            }
			return { 'id':'abas', 'name':'3dsdf', 'age':'123234233' }
        };
    </script>
</body>
</html>
